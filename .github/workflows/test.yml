name: Test

# Runs on pull requests and on main, and is called by publish.yml so nothing is published without
# passing tests. Uses the workspace's locked dependencies (npm ci).

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test the library
        run: npx ng test ngx-signal-forms-renderer --watch=false

      - name: Build the library
        run: npx ng build ngx-signal-forms-renderer

      - name: Build the demo
        run: npx ng build demo
