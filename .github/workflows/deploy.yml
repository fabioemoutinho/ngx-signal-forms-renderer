name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build library
        run: npx ng build ngx-signal-forms-renderer

      - name: Build demo app
        run: npx ng build demo --base-href /ngx-signal-forms-renderer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
